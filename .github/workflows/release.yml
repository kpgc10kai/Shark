name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shark-release.p12"
          {
            echo "SHARK_KEYSTORE=$RUNNER_TEMP/shark-release.p12"
            echo "SHARK_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SHARK_KEY_ALIAS=$KEY_ALIAS"
            echo "SHARK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "SHARK_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SHARK_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-9.7.0-bin.zip"
            "https://services.gradle.org/distributions/gradle-9.7.0-bin.zip"
          )
          for url in "${URLS[@]}"; do
            sed -i -E "s|^distributionUrl=.*|distributionUrl=${url}|" gradle/wrapper/gradle-wrapper.properties
            if ./gradlew :app:assembleRelease --no-daemon --stacktrace \
                 -Dorg.gradle.internal.http.socketTimeout=180000 \
                 -Dorg.gradle.internal.http.connectionTimeout=180000; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Collect artifacts
        run: |
          set -euo pipefail
          APK=$(ls app/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "Shark-${GITHUB_REF_NAME}.apk"
          sha256sum "Shark-${GITHUB_REF_NAME}.apk" > "Shark-${GITHUB_REF_NAME}.apk.sha256.txt"
          cp "Shark-${GITHUB_REF_NAME}.apk.sha256.txt" SHA256SUMS
          ls -l "Shark-${GITHUB_REF_NAME}.apk" SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          English fork of [Yunnijian/Shark](https://github.com/Yunnijian/Shark).

          - English documentation and English UI strings (Chinese kept in `values-zh`)
          - Signed with the fork's own release key, so future releases update in place
          - Package `com.shark.kty` (installs alongside the old `com.pyb110.onekey` build)

          Root is temporary and disappears after a reboot. Only the kernel builds
          listed in the README are accepted. Upstream remains the source of truth.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "Shark $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "Shark-${GITHUB_REF_NAME}.apk" \
            "Shark-${GITHUB_REF_NAME}.apk.sha256.txt" \
            SHA256SUMS
