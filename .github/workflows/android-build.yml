name: android-build

on:
  push:
    branches:
      - english-ui-strings
      - main
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # android-37 is only published on the preview channel at the moment
          "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;37.0.0" "platform-tools" \
            || {
              echo "--- channel 3 failed, listing candidates ---"
              "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[5-9]|build-tools;3[5-9]" || true
              exit 1
            }

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
