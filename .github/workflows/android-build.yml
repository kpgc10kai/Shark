name: android-build

on:
  push:
    branches:
      - english-ui-strings
      - main
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # compileSdk 37.0 is published as "platforms;android-37.0"
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          # gradle-9.7.1-bin.zip is currently unavailable on the CDN (HTTP 504);
          # 9.7.0 is the closest downloadable build. CI only - the repo keeps 9.7.1.
          sed -i 's/gradle-9\.7\.1-bin\.zip/gradle-9.7.0-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties | grep distributionUrl
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if ./gradlew :app:assembleDebug --no-daemon --stacktrace; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            sleep 15
          done
          exit 1
