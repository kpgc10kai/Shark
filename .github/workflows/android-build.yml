name: android-build

on:
  push:
    branches:
      - english-ui-strings
      - main
      - v2.1-en
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # compileSdk 37.0 is published as "platforms;android-37.0"
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          # services.gradle.org currently answers 504 for these distributions,
          # and the wrapper pins gradle-9.7.1 whose CDN object is missing.
          # CI-only: swap in a mirror of 9.7.0, trying several hosts.
          URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-9.7.0-bin.zip"
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-9.7.0-bin.zip"
            "https://services.gradle.org/distributions/gradle-9.7.0-bin.zip"
            "https://services.gradle.org/distributions/gradle-9.7.1-bin.zip"
          )
          for url in "${URLS[@]}"; do
            for attempt in 1 2; do
              echo "::group::try $url (attempt $attempt)"
              sed -i -E "s|^distributionUrl=.*|distributionUrl=${url}|" gradle/wrapper/gradle-wrapper.properties
              if ./gradlew :app:assembleDebug --no-daemon --stacktrace \
                   -Dorg.gradle.internal.http.socketTimeout=180000 \
                   -Dorg.gradle.internal.http.connectionTimeout=180000; then
                echo "::endgroup::"
                exit 0
              fi
              echo "::endgroup::"
              sleep 15
            done
          done
          echo "all Gradle distributions failed"
          exit 1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shark-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
