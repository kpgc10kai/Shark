name: android-build

on:
  push:
    branches:
      - english-ui-strings
      - main
  pull_request:
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # compileSdk 37.0 is published as "platforms;android-37.0"
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          # services.gradle.org currently answers 504 for these distributions,
          # and the wrapper pins gradle-9.7.1 whose CDN object is missing.
          # CI-only: swap in a mirror of 9.7.0, trying several hosts.
          URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-9.7.0-bin.zip"
            "https://services.gradle.org/distributions/gradle-9.7.0-bin.zip"
          )
          for url in "${URLS[@]}"; do
            echo "::group::try $url"
            sed -i -E "s|^distributionUrl=.*|distributionUrl=${url}|" gradle/wrapper/gradle-wrapper.properties
            if ./gradlew :app:assembleDebug --no-daemon --stacktrace; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            sleep 10
          done
          echo "all Gradle distributions failed"
          exit 1
