name: upstream-sync

on:
  schedule:
    # GitHub's minimum is 5 minutes; scheduled runs can be delayed, so poll
    # every 10 minutes and keep the no-change path cheap.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    # run once when this workflow itself changes, so the setup can be tested
    branches:
      - main
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Yunnijian/Shark
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # shallow on purpose: the common case is "nothing new"
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "upstream-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

      - name: Detect upstream changes
        id: check
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)
          if [ -z "$remote_sha" ]; then
            echo "could not read upstream ${UPSTREAM_BRANCH}" >&2
            exit 1
          fi
          echo "sha=${remote_sha}" >> "$GITHUB_OUTPUT"
          echo "short=${remote_sha:0:8}" >> "$GITHUB_OUTPUT"
          marker=$(cat .github/upstream-sha 2>/dev/null | tr -d '[:space:]' || true)
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"
          if [ "$remote_sha" = "$marker" ]; then
            echo "up_to_date=1" >> "$GITHUB_OUTPUT"
            echo "Already synced ${remote_sha:0:8}."
          else
            echo "up_to_date=0" >> "$GITHUB_OUTPUT"
            echo "Upstream moved to ${remote_sha:0:8} (marker ${marker:0:8:-})."
          fi

      - name: Stop if an unresolved conflict is already open
        id: blocked
        if: steps.check.outputs.up_to_date == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${{ steps.check.outputs.short }}"
          open=$(gh issue list --state open --search "Upstream sync conflict ${short} in:title" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${open}" ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
            echo "Conflict issue #${open} already tracks ${short}; waiting for a manual fix."
          else
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch history and upstream
        if: steps.check.outputs.up_to_date == '0' && steps.blocked.outputs.blocked == '0'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Record the marker when already merged
        id: merged
        if: steps.check.outputs.up_to_date == '0' && steps.blocked.outputs.blocked == '0'
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            # already contains the upstream tip (e.g. a previous run pushed the
            # merge but not the marker), so only refresh the marker
            echo "${{ steps.check.outputs.sha }}" > .github/upstream-sha
            git add .github/upstream-sha
            git commit -m "chore: record synced upstream ${{ steps.check.outputs.short }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "already=1" >> "$GITHUB_OUTPUT"
            echo "Already contains the upstream tip; marker updated."
          else
            echo "already=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.up_to_date == '0' && steps.blocked.outputs.blocked == '0' && steps.merged.outputs.already == '0'
        run: |
          set +e
          git merge "upstream/${UPSTREAM_BRANCH}" --no-edit
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "merged=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merged=0" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
          echo "Conflicting files:"
          cat /tmp/conflicts.txt
          git merge --abort || true

      - name: Setup Java
        if: steps.merge.outputs.merged == '1'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        if: steps.merge.outputs.merged == '1'
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Cache Gradle
        if: steps.merge.outputs.merged == '1'
        uses: gradle/actions/setup-gradle@v4

      - name: Build the merged tree
        if: steps.merge.outputs.merged == '1'
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x gradlew
          URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-9.7.0-bin.zip"
            "https://services.gradle.org/distributions/gradle-9.7.0-bin.zip"
          )
          for url in "${URLS[@]}"; do
            sed -i -E "s|^distributionUrl=.*|distributionUrl=${url}|" gradle/wrapper/gradle-wrapper.properties
            if ./gradlew :app:assembleDebug --no-daemon --stacktrace \
                 -Dorg.gradle.internal.http.socketTimeout=180000 \
                 -Dorg.gradle.internal.http.connectionTimeout=180000; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Push the merge
        if: steps.merge.outputs.merged == '1' && success()
        run: |
          set -euo pipefail
          echo "${{ steps.check.outputs.sha }}" > .github/upstream-sha
          git add .github/upstream-sha
          git commit -m "chore: record synced upstream ${{ steps.check.outputs.short }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report a merge conflict
        if: steps.check.outputs.up_to_date == '0' && steps.blocked.outputs.blocked == '0' && steps.merge.outputs.merged == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${{ steps.check.outputs.short }}"
          body=$(printf 'Upstream `%s` moved to `%s` but the automatic merge conflicts.\n\nConflicting files:\n\n```\n%s\n```\n\nResolve locally with:\n\n```bash\ngit fetch upstream\ngit merge upstream/main\n```\n\nA successful sync records `.github/upstream-sha` automatically, so no manual marker edit is needed.\n\nWorkflow run: %s\n' \
            "$UPSTREAM_REPO" "$short" "$(cat /tmp/conflicts.txt)" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          gh issue create --title "Upstream sync conflict ${short}" --body "${body}"

      - name: Report a build failure
        if: steps.merge.outputs.merged == '1' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${{ steps.check.outputs.short }}"
          body=$(printf 'The merged upstream tree (`%s`) **failed to build**, so it was not pushed.\n\nWorkflow run: %s\n' \
            "$short" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          gh issue create --title "Upstream sync build failure ${short}" --body "${body}"
