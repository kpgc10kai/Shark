name: upstream-sync

on:
  schedule:
    # daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    # run once when this workflow itself changes, so the setup can be tested
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Yunnijian/Shark
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "upstream-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

      - name: Check for upstream changes
        id: check
        run: |
          git fetch upstream "${UPSTREAM_BRANCH}" --tags
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "up_to_date=1" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/${UPSTREAM_BRANCH}."
          else
            echo "up_to_date=0" >> "$GITHUB_OUTPUT"
            echo "count=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH})" >> "$GITHUB_OUTPUT"
            echo "New upstream commits: $(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH})"
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.up_to_date == '0'
        run: |
          set +e
          git merge "upstream/${UPSTREAM_BRANCH}" --no-edit
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "merged=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "merged=0" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
          echo "Conflicting files:"
          cat /tmp/conflicts.txt
          git merge --abort || true

      - name: Setup Java
        if: steps.merge.outputs.merged == '1'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        if: steps.merge.outputs.merged == '1'
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Cache Gradle
        if: steps.merge.outputs.merged == '1'
        uses: gradle/actions/setup-gradle@v4

      - name: Build the merged tree
        id: build
        if: steps.merge.outputs.merged == '1'
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x gradlew
          URLS=(
            "https://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-bin.zip"
            "https://mirrors.huaweicloud.com/gradle/gradle-9.7.0-bin.zip"
            "https://services.gradle.org/distributions/gradle-9.7.0-bin.zip"
          )
          for url in "${URLS[@]}"; do
            sed -i -E "s|^distributionUrl=.*|distributionUrl=${url}|" gradle/wrapper/gradle-wrapper.properties
            if ./gradlew :app:assembleDebug --no-daemon --stacktrace \
                 -Dorg.gradle.internal.http.socketTimeout=180000 \
                 -Dorg.gradle.internal.http.connectionTimeout=180000; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Push the merge
        if: steps.merge.outputs.merged == '1' && success()
        run: |
          set -euo pipefail
          # the build above already validated this tree
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report a merge conflict
        if: steps.check.outputs.up_to_date == '0' && steps.merge.outputs.merged == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create upstream-sync --color FBCA04 --description "Upstream sync needs attention" --force >/dev/null 2>&1 || true
          body=$(printf 'Upstream `%s` has new commits but the automatic merge conflicts.\n\nConflicting files:\n\n```\n%s\n```\n\nResolve locally with:\n\n```bash\ngit fetch upstream\ngit merge upstream/main\n```\n\nWorkflow run: %s\n' \
            "$UPSTREAM_REPO" "$(cat /tmp/conflicts.txt)" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          existing=$(gh issue list --label upstream-sync --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "Upstream sync conflict" --body "${body}" --label upstream-sync
          fi

      - name: Report a build failure
        if: steps.merge.outputs.merged == '1' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create upstream-sync --color FBCA04 --description "Upstream sync needs attention" --force >/dev/null 2>&1 || true
          body=$(printf 'The merged upstream tree **failed to build**, so it was not pushed.\n\nWorkflow run: %s\n' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          existing=$(gh issue list --label upstream-sync --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "Upstream sync build failure" --body "${body}" --label upstream-sync
          fi
